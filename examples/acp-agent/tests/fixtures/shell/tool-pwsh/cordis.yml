# Minimal tool-pwsh composition: real app boot path, real pwsh executor, real
# foreground + background tool calls; driven by the package's loader.spec.ts.
- id: system-prompt
  name: '@coco-harness/cch-system-prompt'

- id: tools
  name: '@coco-harness/cch-tools'

- id: subprocess
  name: '@coco-harness/cch-subprocess-local'

- id: bash
  name: '@coco-harness/cch-pwsh-local'
  config:
    graceMs: 200

- id: shell-env
  name: '@coco-harness/cch-shell-env'

- id: tasks
  name: '@coco-harness/cch-jobs-local'

- id: tool-jobs
  name: '@coco-harness/cch-tool-jobs'

- id: tool-pwsh
  name: '@coco-harness/cch-tool-pwsh'
